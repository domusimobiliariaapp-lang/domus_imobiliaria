<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B3A47"/>
      <stop offset="100%" stop-color="#0E2028"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE5B0"/>
      <stop offset="50%" stop-color="#D4A359"/>
      <stop offset="100%" stop-color="#966427"/>
    </linearGradient>
    <linearGradient id="goldV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCE5B0"/>
      <stop offset="100%" stop-color="#AD7B3B"/>
    </linearGradient>
  </defs>

  <!-- Fundo arredondado petróleo -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <!-- Borda dourada sutil -->
  <rect x="12" y="12" width="488" height="488" rx="98" fill="none" stroke="#AD7B3B" stroke-width="6" stroke-opacity="0.4"/>

  <!-- Telhado / Frontão -->
  <polygon points="256,72 68,226 68,272 256,118 444,272 444,226" fill="url(#gold)"/>

  <!-- Pilar esquerdo -->
  <rect x="140" y="248" width="60" height="192" rx="6" fill="url(#goldV)"/>
  <!-- Pilar direito -->
  <rect x="312" y="248" width="60" height="192" rx="6" fill="url(#goldV)"/>
  <!-- Arco central (porta em arco) -->
  <path d="M200 440 V318 Q200 240 256 240 Q312 240 312 318 V440 Z" fill="url(#goldV)"/>
  <!-- Abertura do arco (buraco) -->
  <path d="M228 440 V326 Q228 272 256 272 Q284 272 284 326 V440 Z" fill="url(#bg)"/>

  <!-- Ponto de luz no topo do arco -->
  <circle cx="256" cy="286" r="16" fill="#FCE5B0" opacity="0.85"/>
</svg>
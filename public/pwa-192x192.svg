<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B3A47"/>
      <stop offset="50%" stop-color="#17323D"/>
      <stop offset="100%" stop-color="#0E2028"/>
    </linearGradient>
    <linearGradient id="domusGold192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE5B0"/>
      <stop offset="45%" stop-color="#D4A359"/>
      <stop offset="100%" stop-color="#966427"/>
    </linearGradient>
    <linearGradient id="domusPillar192" x1="0%" y1="0%" x2="0%" y2="100%">
